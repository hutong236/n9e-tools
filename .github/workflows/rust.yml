name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check embedded Web JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("static/index.html").read_text(encoding="utf-8")
          assert html.count("<script>") == 1
          assert html.count("</script>") == 1
          Path("/tmp/n9e-importer-ui.js").write_text(html.split("<script>", 1)[1].split("</script>", 1)[0], encoding="utf-8")
          PY
          node --check /tmp/n9e-importer-ui.js
          node --test tests/ui-selection.test.cjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        run: cargo test --all-targets
      - name: Compile release
        run: cargo build --release
      - name: Upload Linux AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: n9e-tools-linux-amd64
          path: target/release/n9e-tools
          if-no-files-found: error
