name: Build downloadable binaries

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: 'Package label (letters, numbers, dot, underscore, dash)'
        required: true
        default: 'v0.4.0'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-15-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate package label
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_LABEL" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,79}$ ]]; then
            echo "::error::Invalid package label"
            exit 1
          fi

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Build release executable
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify native architecture
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          file "target/$TARGET/release/n9e-tools"
          test -x "target/$TARGET/release/n9e-tools"

      - name: Package executable, README, and checksum
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          set -euo pipefail
          name="n9e-tools-${RELEASE_LABEL}-${PLATFORM}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/n9e-tools" "dist/$name/n9e-tools"
          cp README.md "dist/$name/README.md"
          chmod +x "dist/$name/n9e-tools"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (
            cd dist
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          )
          echo "archive=$name" >> "$GITHUB_OUTPUT"

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Package summary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Show download instructions
        shell: bash
        run: |
          {
            echo '## Binaries built successfully'
            echo ''
            echo 'Download each artifact from the **Artifacts** section of this workflow run.'
            echo ''
            echo '| Package | Native architecture |'
            echo '| --- | --- |'
            echo '| linux-x86_64 | Linux x86-64 (glibc / Ubuntu 22.04 build environment) |'
            echo '| macos-arm64 | macOS Apple Silicon (aarch64) |'
            echo ''
            echo 'Each artifact contains a tar.gz archive and a SHA-256 checksum.'
            echo 'Extract and run `./n9e-tools`.'
            echo 'Default bind address: 127.0.0.1:8088.'
          } >> "$GITHUB_STEP_SUMMARY"
