name: Build downloadable binaries

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: 'Package label (letters, numbers, dot, underscore, dash)'
        required: true
        default: 'v0.5.0'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate package label
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_LABEL" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,79}$ ]]; then
            echo "::error::Invalid package label"
            exit 1
          fi

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Rust tests
        run: cargo test --all-targets

      - name: Build release executable
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify native architecture
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          file "target/$TARGET/release/n9e-tools"
          test -x "target/$TARGET/release/n9e-tools"

      - name: Package executable, README, and checksum
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          set -euo pipefail
          name="n9e-tools-${RELEASE_LABEL}-${PLATFORM}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/n9e-tools" "dist/$name/n9e-tools"
          cp README.md "dist/$name/README.md"
          chmod +x "dist/$name/n9e-tools"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (
            cd dist
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          )
          echo "archive=$name" >> "$GITHUB_OUTPUT"

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: binary-release-${{ inputs.release_label }}
      cancel-in-progress: false
    steps:
      - name: Download both platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: n9e-tools-${{ inputs.release_label }}-*
          path: release-assets
          merge-multiple: true

      - name: Validate release files and checksums
        shell: bash
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          set -euo pipefail
          cd release-assets
          for platform in linux-x86_64 macos-arm64; do
            archive="n9e-tools-${RELEASE_LABEL}-${platform}.tar.gz"
            test -s "$archive"
            test -s "$archive.sha256"
            shasum -a 256 -c "$archive.sha256"
          done
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2

      - name: Fail if release already exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          if gh release view "$RELEASE_LABEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_LABEL already exists; choose a new version."
            exit 1
          fi

      - name: Create release and upload binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Nightingale v8 Excel alert-rule importer — $RELEASE_LABEL

          ### Download packages
          - Linux x86_64: n9e-tools-$RELEASE_LABEL-linux-x86_64.tar.gz
          - macOS Apple Silicon (arm64): n9e-tools-$RELEASE_LABEL-macos-arm64.tar.gz

          Both packages contain the n9e-tools executable and README.md.
          SHA-256 checksum files are provided for verification.
          Run ./n9e-tools after extraction. Default address: http://127.0.0.1:8088

          Source commit: $GITHUB_SHA
          EOF
          gh release create "$RELEASE_LABEL" release-assets/*.tar.gz release-assets/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "n9e-tools $RELEASE_LABEL" \
            --notes-file release-notes.md \
            --latest

      - name: Show published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          url="$(gh release view "$RELEASE_LABEL" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          {
            echo "## GitHub Release published"
            echo ""
            echo "Release: $url"
            echo ""
            echo "Assets: Linux x86_64 and macOS arm64 tar.gz plus SHA-256 files."
          } >> "$GITHUB_STEP_SUMMARY"
