name: Build multi-platform Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v0.6.0; no spaces or slash)'
        required: true
        default: 'v0.6.0'
        type: string
      push_latest:
        description: 'Also publish latest tag'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build linux/amd64 + linux/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker tag: $IMAGE_TAG"
            exit 1
          fi

      - name: Prepare image name and tags
        id: image
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image=$image"
            echo 'tags<<EOF'
            echo "$image:$IMAGE_TAG"
            if [[ "$PUSH_LATEST" == "true" ]]; then
              echo "$image:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Nightingale v8 Excel alert rule importer
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published manifest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG"

      - name: Publish summary
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ inputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            echo '## Multi-platform image published'
            echo ''
            echo "Image: $IMAGE:$IMAGE_TAG"
            echo 'Platforms: linux/amd64, linux/arm64'
            echo "Digest: $DIGEST"
            echo ''
            echo 'Pull:'
            echo "docker pull $IMAGE:$IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
